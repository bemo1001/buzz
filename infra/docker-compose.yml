# Run Buzzit locally or on a small server:
#   docker compose -f infra/docker-compose.yml up -d
# Data (SQLite database, encryption key, media) lives in the buzzit-data volume.
# In production put a TLS proxy (Caddy, nginx, a cloud load balancer) in front,
# or pass --tls-cert/--tls-key.
services:
  buzzit:
    build: { context: ../services }
    restart: unless-stopped
    command: ["--addr", ":8080", "--data", "/data"]
    environment:
      BUZZIT_MAX_UPLOAD_MB: "50"
      # Optional push wake-ups through Firebase. Mount the key and uncomment:
      # BUZZIT_FCM_SERVICE_ACCOUNT: /secrets/fcm.json
    ports: ["8080:8080"]
    volumes:
      - buzzit-data:/data
      # - ./secrets/fcm.json:/secrets/fcm.json:ro

volumes:
  buzzit-data: {}

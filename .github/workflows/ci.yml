name: ci
on:
  push: { branches: [main] }
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: services/go.mod, cache-dependency-path: services/go.sum }
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: CGO_ENABLED=0 go build -o buzzit-server ./cmd/buzzit-server
      - uses: actions/upload-artifact@v4
        with: { name: buzzit-server, path: services/buzzit-server }

  android:
    runs-on: ubuntu-latest
    needs: server
    defaults: { run: { working-directory: apps/android } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17", cache: gradle }
      - uses: actions/download-artifact@v4
        with: { name: buzzit-server, path: /tmp/server }
      - name: Start a real server for the contract test
        run: |
          chmod +x /tmp/server/buzzit-server
          /tmp/server/buzzit-server --addr 127.0.0.1:8095 --data /tmp/bzdata &
          sleep 1
      - run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleRelease
        env: { BUZZIT_TEST_SERVER: "http://127.0.0.1:8095" }
      - uses: actions/upload-artifact@v4
        with: { name: buzzit-debug-apk, path: apps/android/app/build/outputs/apk/debug/app-debug.apk }

  api-spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npx --yes @redocly/cli@1.25.11 lint api/openapi.yaml

  docker:
    runs-on: ubuntu-latest
    needs: server
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t buzzit/server services

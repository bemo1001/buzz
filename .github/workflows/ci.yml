name: ci
on:
  push: { branches: [main] }
  pull_request:

jobs:
  services:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.24", cache-dependency-path: services/go.mod }
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...

  api-spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npx --yes @redocly/cli@1.25.11 lint api/openapi.yaml

  docker:
    runs-on: ubuntu-latest
    needs: services
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t buzzit/buzz-svc services
